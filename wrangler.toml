name = "cloudflare-alpaca-paper-trader"
main = "src/v8/index.js"
compatibility_date = "2026-08-27"

[triggers]
crons = ["* * * * 1-5"]

[vars]
TRADING_ENABLED = "true"
SYMBOLS = "SPY,QQQ,IWM,DIA,NVDA,AAPL,TSLA,AMD,AMZN,META,MSFT,GOOGL,AVGO,NFLX,CRM"
MARKET_DATA_FEED = "sip"
DYNAMIC_SCANNER_ENABLED = "true"
SCANNER_MOST_ACTIVE_TOP = "20"
SCANNER_MOVERS_TOP = "10"
MAX_UNIVERSE_SYMBOLS = "18"
MIN_ENTRY_SCORE = "82"
MAX_CONCURRENT_POSITIONS = "2"
MAX_TECH_POSITIONS = "1"
ORDER_NOTIONAL_USD = "5"
MAX_POSITION_USD = "5"
MAX_TOTAL_EXPOSURE_USD = "10"
RISK_PER_TRADE_PCT = "0.00025"
STOP_LOSS_PCT = "0.0045"
MIN_STOP_LOSS_PCT = "0.003"
MAX_STOP_LOSS_PCT = "0.009"
TARGET_R_MULTIPLE = "1.8"
MAX_SPREAD_PCT = "0.0025"
MAX_QUOTE_AGE_SECONDS = "20"
MIN_DOLLAR_VOLUME_USD = "25000000"
MIN_QUOTE_SIZE = "1"
MIN_PRICE_USD = "5"
MAX_ENTRY_SLIPPAGE_PCT = "0.0008"
MAX_EXIT_SLIPPAGE_PCT = "0.0012"
ORDER_TIMEOUT_SECONDS = "75"
MAX_DAILY_LOSS_PCT = "0.01"
MAX_DAILY_LOSING_EXITS = "3"
MAX_CONSECUTIVE_LOSSES = "3"
SYMBOL_COOLDOWN_MINUTES = "45"
NEWS_RISK_FILTER_ENABLED = "true"
NEWS_LOOKBACK_MINUTES = "45"
SHORTS_ENABLED = "false"
EVENT_BLACKOUT_WINDOWS_ET = ""
