name = "cloudflare-alpaca-paper-trader"
main = "src/index.js"
compatibility_date = "2026-08-27"

[triggers]
crons = ["* * * * 1-5"]

[vars]
TRADING_ENABLED = "true"
SYMBOLS = "SPY,QQQ,IWM,NVDA,AAPL,TSLA,AMD,AMZN,META,MSFT"
MIN_ENTRY_SCORE = "82"
MAX_CONCURRENT_POSITIONS = "2"
ORDER_NOTIONAL_USD = "5"
MAX_POSITION_USD = "5"
MAX_TOTAL_EXPOSURE_USD = "10"
STOP_LOSS_PCT = "0.0045"
TAKE_PROFIT_PCT = "0.009"
TRAIL_TRIGGER_PCT = "0.0055"
TRAIL_GIVEBACK_PCT = "0.002"
MAX_DAILY_LOSS_PCT = "0.01"
MAX_DAILY_LOSING_EXITS = "3"
SYMBOL_COOLDOWN_MINUTES = "45"
