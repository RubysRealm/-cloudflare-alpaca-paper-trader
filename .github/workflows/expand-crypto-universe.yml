name: Expand crypto universe to every Alpaca pair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-crypto-universe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove artificial crypto universe restrictions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/v8/crypto.js')
          s = p.read_text()
          old = '''    const usable = (Array.isArray(assets) ? assets : []).filter(a => {
      const s = String(a.symbol || "").toUpperCase();
      return a.status !== "inactive" && a.tradable !== false && a.fractionable !== false && (s.endsWith("/USD") || (!s.includes("/") && s.endsWith("USD")));
    });'''
          new = '''    const usable = (Array.isArray(assets) ? assets : []).filter(a =>
      a && a.symbol && a.status !== "inactive" && a.tradable !== false
    );'''
          assert old in s, 'primary universe filter not found'
          s = s.replace(old, new, 1)
          old = 'const u = await cryptoUniverse(env), assets = u.assets.slice(0, int(env.CRYPTO_MAX_UNIVERSE_SYMBOLS, 100)), symbols = assets.map(a => a.symbol);'
          new = 'const u = await cryptoUniverse(env), assets = u.assets, symbols = assets.map(a => a.symbol);'
          assert old in s, 'primary universe cap not found'
          s = s.replace(old, new, 1)
          old = 'const maxSpread = pct(env.CRYPTO_MAX_SPREAD_PCT, 0.004), maxAge = int(env.CRYPTO_MAX_QUOTE_AGE_SECONDS, 20), minDollarVolume = num(env.CRYPTO_MIN_DOLLAR_VOLUME_USD, 1000000), minQuoteUsd = num(env.CRYPTO_MIN_QUOTE_NOTIONAL_USD, 1000);'
          new = 'const maxSpread = pct(env.CRYPTO_MAX_SPREAD_PCT, 0.004), maxAge = int(env.CRYPTO_MAX_QUOTE_AGE_SECONDS, 20), minDollarVolume = 0, minQuoteUsd = num(env.CRYPTO_MIN_QUOTE_NOTIONAL_USD, 1000);'
          assert old in s, 'primary crypto volume gate not found'
          s = s.replace(old, new, 1)
          old = 'return !occupied.has(key) && !cryptoOpen.has(key) && !cooldowns.has(key) && s.longConfirmed'
          new = 'return String(s.symbol).toUpperCase().endsWith("/USD") && !occupied.has(key) && !cryptoOpen.has(key) && !cooldowns.has(key) && s.longConfirmed'
          assert old in s, 'primary execution route filter insertion point not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/v8/crypto-opportunity.js')
          s = p.read_text()
          old = '''  return (Array.isArray(assets) ? assets : []).filter(a => {
    const s = String(a.symbol || "").toUpperCase();
    return a.status !== "inactive" && a.tradable !== false && a.fractionable !== false && (s.endsWith("/USD") || (!s.includes("/") && s.endsWith("USD")));
  }).slice(0, int(env.CRYPTO_MAX_UNIVERSE_SYMBOLS, 100));'''
          new = '''  return (Array.isArray(assets) ? assets : []).filter(a =>
    a && a.symbol && a.status !== "inactive" && a.tradable !== false
  );'''
          assert old in s, 'fallback universe filter/cap not found'
          s = s.replace(old, new, 1)
          old = 'const ranked = r.candidates.filter(x => Object.values(gates(x,minScore,minDepth,maxSpread,maxAge)).every(Boolean)).sort((a,b) => b.cryptoScore - a.cryptoScore);'
          new = 'const ranked = r.candidates.filter(x => String(x.symbol).toUpperCase().endsWith("/USD") && Object.values(gates(x,minScore,minDepth,maxSpread,maxAge)).every(Boolean)).sort((a,b) => b.cryptoScore - a.cryptoScore);'
          assert old in s, 'fallback probe execution route not found'
          s = s.replace(old, new, 1)
          old = 'return !held.has(k) && !open.has(k) && !cooldown.has(k) && Object.values(gates(x,minScore,minDepth,maxSpread,maxAge)).every(Boolean);'
          new = 'return String(x.symbol).toUpperCase().endsWith("/USD") && !held.has(k) && !open.has(k) && !cooldown.has(k) && Object.values(gates(x,minScore,minDepth,maxSpread,maxAge)).every(Boolean);'
          assert old in s, 'fallback execution route filter insertion point not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit expanded scanner
        run: |
          git config user.name "RubysRealm"
          git config user.email "codygiles28@gmail.com"
          git add src/v8/crypto.js src/v8/crypto-opportunity.js
          git rm .github/workflows/expand-crypto-universe.yml
          git commit -m "Scan every active Alpaca crypto pair"
          git push
