name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production crypto state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/status")"
          OPP="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/opportunity")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "CRYPTO_OPPORTUNITY=$OPP"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`build=${x.cryptoEntryBuild} positions=${x.cryptoPositionCount} orders=${x.cryptoBotOrderCount} last=${x.lastCryptoBotOrderAt}`)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`universe=${x.universeCount} unique=${x.uniqueCryptoAssets} quotes=${JSON.stringify(x.quoteMarkets)} all=${x.allActiveTradablePairs}`); if(!(x.universeCount>=73) || x.allActiveTradablePairs!==true || !["USD","USDC","USDT","BTC"].every(q=>(x.quoteMarkets||[]).includes(q))) process.exit(7)' "$STATUS"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`probe_universe=${x.universeCount} all=${x.allActiveTradablePairs} valid=${x.validSignals} executable=${x.executableCount} mode=${x.mode}`); if(!(x.universeCount>=73) || x.allActiveTradablePairs!==true) process.exit(8)' "$OPP"
          echo "recheck=2026-09-01-full-crypto-universe"
