name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/status")"
          STATE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/state")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "TRADING_STATE=$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} build=${x.cryptoEntryBuild} policy=${x.exitPolicy} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-revenue-v5" || x.cryptoEntryBuild!=="crypto-revenue-v5" || x.exitPolicy!=="trail_profit_then_reenter_lower" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(7)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; console.log(`universe=${x.universeCount} fixed_target=${r.fixedProfitTarget} trailing=${r.trailingProfitProtection} profit_guard=${r.profitToLossGuard} reentry_lower=${r.reentryBelowLastSell} loss_exits=${r.normalLossTakingExits}`); if(x.strategy!=="crypto-revenue-v5" || x.cryptoEntryBuild!=="crypto-revenue-v5" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || r.singleEngineOwnership!==true || r.fixedProfitTarget!==false || r.trailingProfitProtection!==true || r.profitToLossGuard!==true || r.reentryBelowLastSell!==true || r.normalLossTakingExits!==false || x.fixedProfitTargetPct!==0) process.exit(8)' "$STATUS"
