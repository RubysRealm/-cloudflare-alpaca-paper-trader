name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/status")"
          STATE="$(curl --fail --silent --show-error --max-time 90 "$BASE/api/state")"
          STOCK="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/status")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "TRADING_STATE=$STATE"
          echo "STOCK_STATUS=$STOCK"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} build=${x.cryptoEntryBuild} policy=${x.exitPolicy} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-opportunity-v7" || x.cryptoEntryBuild!=="crypto-opportunity-v7" || x.exitPolicy!=="relative_opportunity_profit_rotation" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(7)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; console.log(`universe=${x.universeCount} relative=${r.relativeOpportunityRanking} absolute_gate=${r.absoluteScoreGate} probability=${r.probabilityWeightedRanking} movement=${r.movementOpportunityRanking} catalyst=${r.catalystAware}`); if(x.strategy!=="crypto-opportunity-v7" || x.cryptoEntryBuild!=="crypto-opportunity-v7" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || r.relativeOpportunityRanking!==true || r.absoluteScoreGate!==false || r.broadMarketAnchorAsWeight!==true || r.broadMarketAnchorHardGate!==false || r.tradeVolumeObjective!==false || r.probabilityWeightedRanking!==true || r.movementOpportunityRanking!==true || r.catalystAware!==true || r.positiveNetEdgeRequired!==true || x.maxConcurrentPositions!==2 || x.orderNotionalUsd!==25000) process.exit(8)' "$STATUS"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.features||{},s=x.safeguards||{}; console.log(`stock=${x.strategy} relative=${f.relativeOpportunityRanking} absolute_gate=${f.absoluteScoreGate} universe=${s.maxUniverseSymbols} positions=${s.maxConcurrentPositions} order=${s.orderNotionalUsd}`); if(x.strategy!=="selective-opportunity-v10" || f.relativeOpportunityRanking!==true || f.absoluteScoreGate!==false || f.tradeVolumeObjective!==false || f.probabilityWeightedRanking!==true || f.movementOpportunityRanking!==true || f.catalystAware!==true || f.positiveNetEdgeRequired!==true || s.maxUniverseSymbols!==200 || s.maxConcurrentPositions!==2 || s.orderNotionalUsd!==35000) process.exit(9)' "$STOCK"
