name: Free-tier live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          STOCK="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/status")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/status")"
          LIVE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/live")"
          STATE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/state")"
          echo "STOCK=$STOCK"
          echo "CRYPTO=$CRYPTO"
          echo "CRYPTO_LIVE=$LIVE"
          echo "STATE=$STATE"
          node -e 'const s=JSON.parse(process.argv[1]),c=JSON.parse(process.argv[2]),l=JSON.parse(process.argv[3]),a=JSON.parse(process.argv[4]); if(s.strategy!=="free-tier-deep-stock-v12"||s.build!=="free-tier-research-v1"||s.freeTier?.cpuMsPerInvocation!==10||c.strategy!=="free-tier-deep-crypto-v9"||c.cryptoEntryBuild!=="free-tier-research-v1"||c.freeTier?.cpuMsPerInvocation!==10||l.strategy!=="free-tier-deep-crypto-v9"||a.build!=="free-tier-research-v1"||!(a.equity>0))process.exit(9); console.log(`verified stock=${s.strategy} crypto=${c.strategy} equity=${a.equity} crypto_positions=${l.cryptoPositionCount}`)' "$STOCK" "$CRYPTO" "$LIVE" "$STATE"
