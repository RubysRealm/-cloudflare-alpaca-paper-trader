name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/status")"
          STATE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/state")"
          HISTORY="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/portfolio/history")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "TRADING_STATE=$STATE"
          node -e '
            const x=JSON.parse(process.argv[1]);
            const pts=x.timestamp.map((t,i)=>({t,e:+x.equity[i],p:+x.profit_loss[i],pp:+x.profit_loss_pct[i]}));
            const targets=[1788336240,1788339600,1788343200,1788346800,1788350400];
            const label={1788336240:"04:04",1788339600:"05:00",1788343200:"06:00",1788346800:"07:00",1788350400:"08:00"};
            for(const t of targets){const q=pts.find(z=>z.t===t); console.log(`POINT ${label[t]} ET equity=${q?.e} pnl=${q?.p} pnlPct=${q?.pp}`)}
            const start=1788336240, seven=1788346800;
            const a=pts.filter(z=>z.t>=start&&z.t<=seven), b=pts.filter(z=>z.t>=seven);
            const maxBy=y=>y.reduce((m,z)=>!m||z.e>m.e?z:m,null), minBy=y=>y.reduce((m,z)=>!m||z.e<m.e?z:m,null);
            const fmt=z=>z?`${new Date(z.t*1000).toLocaleString("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",hour12:true})} ET equity=${z.e} pnl=${z.p}`:"none";
            const a0=a[0], a1=a[a.length-1], b0=b[0], b1=b[b.length-1], aMax=maxBy(a),aMin=minBy(a),bMax=maxBy(b),bMin=minBy(b);
            console.log(`WINDOW_0404_0700 start=${a0?.e} end=${a1?.e} change=${(a1.e-a0.e).toFixed(2)} max=${fmt(aMax)} min=${fmt(aMin)}`);
            console.log(`WINDOW_POST_0700 start=${b0?.e} latest=${b1?.e} change=${(b1.e-b0.e).toFixed(2)} max=${fmt(bMax)} min=${fmt(bMin)}`);
            console.log(`PEAK_TO_LATEST peak=${aMax?.e} latest=${b1?.e} giveback=${(b1.e-aMax.e).toFixed(2)}`);
          ' "$HISTORY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.strategy!=="crypto-revenue-v4" || x.cryptoEntryBuild!=="crypto-revenue-v4" || x.exitPolicy!=="normal_exits_require_net_profit" || x.legacyExecutionActive!==false) process.exit(7)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; if(x.strategy!=="crypto-revenue-v4" || !(x.universeCount>=73) || r.normalLossTakingExits!==false) process.exit(8)' "$STATUS"
