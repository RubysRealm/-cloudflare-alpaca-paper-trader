name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production crypto state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/status")"
          OPP="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/opportunity")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "CRYPTO_OPPORTUNITY=$OPP"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`build=${x.cryptoEntryBuild} positions=${x.cryptoPositionCount} orders=${x.cryptoBotOrderCount} last=${x.lastCryptoBotOrderAt}`)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`build=${x.cryptoEntryBuild} valid=${x.validSignals} executable=${x.executableCount} minVol=${x.thresholds?.minVol} volumeGate=${x.thresholds?.volumeGate} mode=${x.mode} leaders=${JSON.stringify(x.leaders||[])}`)' "$OPP"
          echo "recheck=2026-09-01-after-explicit-volume-gate-removal"
