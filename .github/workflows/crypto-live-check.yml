name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/status")"
          STATE="$(curl --fail --silent --show-error --max-time 90 "$BASE/api/state")"
          STOCK="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/status")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "TRADING_STATE=$STATE"
          echo "STOCK_STATUS=$STOCK"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} build=${x.cryptoEntryBuild} policy=${x.exitPolicy} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-deep-research-v8" || x.cryptoEntryBuild!=="crypto-deep-research-v8" || x.exitPolicy!=="deep_research_profit_rotation" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(7)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; console.log(`universe=${x.universeCount} deep=${r.deepFinalistResearch} tape=${r.recentTradeTape} venue=${r.secondaryVenueTapeBestEffort} rs=${r.crossSectionRelativeStrength}`); if(x.strategy!=="crypto-deep-research-v8" || x.cryptoEntryBuild!=="crypto-deep-research-v8" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || r.deepFinalistResearch!==true || r.researchBeforeExecution!==true || r.recentTradeTape!==true || r.secondaryVenueTapeBestEffort!==true || r.crossSectionRelativeStrength!==true || r.relativeOpportunityRanking!==true || r.absoluteScoreGate!==false || r.tradeVolumeObjective!==false || r.probabilityWeightedRanking!==true || r.movementOpportunityRanking!==true || r.catalystAware!==true || r.positiveNetEdgeRequired!==true || x.maxConcurrentPositions!==2 || x.orderNotionalUsd!==25000) process.exit(8)' "$STATUS"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.features||{},s=x.safeguards||{}; console.log(`stock=${x.strategy} deep=${f.deepFinalistResearch} tape=${f.tradeTapeResearch} daily=${f.dailyContext} options=${f.optionsVolatilityContext}`); if(x.strategy!=="selective-deep-research-v11" || f.deepFinalistResearch!==true || f.tradeTapeResearch!==true || f.dailyContext!==true || f.optionsVolatilityContext!==true || f.corporateActionContext!==true || f.researchBeforeExecution!==true || f.relativeOpportunityRanking!==true || f.tradeVolumeObjective!==false || f.probabilityWeightedRanking!==true || f.catalystAware!==true || s.maxUniverseSymbols!==200 || s.maxConcurrentPositions!==2 || s.orderNotionalUsd!==35000) process.exit(9)' "$STOCK"
