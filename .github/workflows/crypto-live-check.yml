name: Crypto live execution check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-live-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current production trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          LIVE="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/live")"
          STATUS="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/status")"
          STATE="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/state")"
          STOCK="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/status")"
          echo "CRYPTO_LIVE=$LIVE"
          echo "CRYPTO_STATUS=$STATUS"
          echo "TRADING_STATE=$STATE"
          echo "STOCK_STATUS=$STOCK"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} build=${x.cryptoEntryBuild} policy=${x.exitPolicy} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-conviction-v6" || x.cryptoEntryBuild!=="crypto-conviction-v6" || x.exitPolicy!=="selective_conviction_profit_rotation" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(7)' "$LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; console.log(`universe=${x.universeCount} selective=${r.selectiveConviction} volume_goal=${r.tradeVolumeObjective} broad_anchor=${r.broadMarketAnchorConfirmation} positions=${x.maxConcurrentPositions} order=${x.orderNotionalUsd}`); if(x.strategy!=="crypto-conviction-v6" || x.cryptoEntryBuild!=="crypto-conviction-v6" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || r.selectiveConviction!==true || r.tradeVolumeObjective!==false || r.expectedNetEdgeRanking!==true || r.broadMarketAnchorConfirmation!==true || r.reentryBelowLastSell!==false || x.maxConcurrentPositions!==2 || x.orderNotionalUsd!==25000) process.exit(8)' "$STATUS"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.features||{},s=x.safeguards||{}; console.log(`stock=${x.strategy} selective=${f.selectiveConviction} volume_goal=${f.tradeVolumeObjective} universe=${s.maxUniverseSymbols} positions=${s.maxConcurrentPositions} order=${s.orderNotionalUsd}`); if(x.strategy!=="selective-conviction-v9" || f.selectiveConviction!==true || f.tradeVolumeObjective!==false || f.expectedNetEdgeRanking!==true || s.maxUniverseSymbols!==150 || s.maxConcurrentPositions!==2 || s.orderNotionalUsd!==35000) process.exit(9)' "$STOCK"
