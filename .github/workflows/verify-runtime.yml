name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production status and realtime state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/state")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} status=${x.status} endpoint=${x.endpoint} feed=${x.features?.marketDataFeed} universe=${x.safeguards?.maxUniverseSymbols}`); if(x.strategy!=="intraday-adaptive-v8.1" || x.endpoint!=="paper" || x.status!=="armed" || x.features?.curatedLiquidUniverse!==true || x.features?.discordConsensusEngine!==true || x.features?.marketDataFeed!=="iex" || x.safeguards?.maxUniverseSymbols!==30 || Math.abs((x.safeguards?.maxSpreadPct||0)-0.0015)>1e-9 || x.safeguards?.minDollarVolume!==50000000) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`stream_connected=${Boolean(x.connected)} feed=${x.stream?.feed||"unknown"} symbols=${x.symbolsTracked||0}`)' "$STATE"
