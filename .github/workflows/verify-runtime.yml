name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 90
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/live")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const s=x.safeguards||{},f=x.features||{},tf=f.multiTimeframe||[]; console.log(`stock=${x.strategy} universe=${s.maxUniverseSymbols} positions=${s.maxConcurrentPositions} order=${s.orderNotionalUsd}`); if(x.strategy!=="selective-opportunity-v10" || x.endpoint!=="paper" || x.status!=="armed" || f.dynamicScanner!==true || f.relativeOpportunityRanking!==true || f.absoluteScoreGate!==false || f.tradeVolumeObjective!==false || f.probabilityWeightedRanking!==true || f.movementOpportunityRanking!==true || f.catalystAware!==true || f.positiveNetEdgeRequired!==true || f.opportunityCostExit!==true || !["1Min","5Min","15Min","1Hour"].every(t=>tf.includes(t)) || s.maxConcurrentPositions!==2 || s.maxUniverseSymbols!==200 || s.maxNewEntriesPerCycle!==1 || s.maxTotalExposureUsd!==70000 || s.orderNotionalUsd!==35000 || s.minDollarVolume!==5000000) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); const c=x.runtimeConfig||{}; const d=x.diagnostics||{}; console.log(`state_equity=${x.equity} order=${c.orderNotionalUsd} maxpos=${c.maxConcurrentPositions} universe=${c.maxUniverseSymbols} observed=${d.universeCount}`); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError || c.orderNotionalUsd!==35000 || c.maxPositionUsd!==35000 || c.maxTotalExposureUsd!==70000 || c.maxConcurrentPositions!==2 || c.maxUniverseSymbols!==200 || !(d.universeCount>=150)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; const tf=r.timeframes||[]; console.log(`crypto=${x.strategy} build=${x.cryptoEntryBuild} universe=${x.universeCount} positions=${x.maxConcurrentPositions} order=${x.orderNotionalUsd}`); if(x.strategy!=="crypto-opportunity-v7" || x.cryptoEntryBuild!=="crypto-opportunity-v7" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || r.relativeOpportunityRanking!==true || r.absoluteScoreGate!==false || r.broadMarketAnchorAsWeight!==true || r.broadMarketAnchorHardGate!==false || r.tradeVolumeObjective!==false || r.probabilityWeightedRanking!==true || r.movementOpportunityRanking!==true || r.catalystAware!==true || r.positiveNetEdgeRequired!==true || r.opportunityCostExit!==true || r.singleEngineOwnership!==true || !["1Min","5Min","15Min","1Hour","4Hour"].every(t=>tf.includes(t)) || x.maxConcurrentPositions!==2 || x.maxTotalExposureUsd!==50000 || x.orderNotionalUsd!==25000) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`live_crypto=${x.strategy} build=${x.cryptoEntryBuild} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-opportunity-v7" || x.cryptoEntryBuild!=="crypto-opportunity-v7" || x.endpoint!=="paper" || x.exitPolicy!=="relative_opportunity_profit_rotation" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
