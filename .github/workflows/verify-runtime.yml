name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 90
      - name: Check adaptive free-tier production runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/live")"
          ROUTER="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/router/opportunity")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          echo "PRODUCTION_ROUTER=$ROUTER"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.freeTier||{},r=x.research||{}; if(x.strategy!=="free-tier-deep-stock-v13" || x.build!=="free-tier-research-v4" || x.endpoint!=="paper" || x.status!=="armed" || x.adaptiveMarketRouting!==true || f.cpuMsPerInvocation!==10 || f.requestLimitPerDay!==100000 || f.architecture!=="broad_screener_then_cpu_sliced_deep_finalist" || f.finalists!==1 || !(f.rotationPool>=3) || r.marketWideMovers!==true || r.marketWideMostActive!==true || r.deepFinalistResearch!==true || r.cpuSlicedCandidateRotation!==true || r.recentTradeTape!==true || r.researchBeforeExecution!==true || r.antiChaseEntryTiming!==true || r.tradeVolumeObjective!==false) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.mode!=="direct_alpaca_rest" || x.build!=="free-tier-research-v4" || !(x.equity>0) || !Array.isArray(x.positionSummary) || !Array.isArray(x.recentOrders)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.freeTier||{},r=x.research||{},tf=r.timeframes||[]; if(x.strategy!=="free-tier-deep-crypto-v9" || x.cryptoEntryBuild!=="free-tier-research-v4" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || x.adaptiveMarketRouting!==true || f.cpuMsPerInvocation!==10 || f.requestLimitPerDay!==100000 || f.architecture!=="all_market_snapshot_then_deep_finalists" || f.finalists!==1 || f.alternatingMarketDiscovery!==false || f.adaptiveMarketRouting!==true || r.allActiveTradablePairs!==true || r.deepFinalistResearch!==true || r.orderBookDepth!==true || r.recentTradeTape!==true || r.crossSectionRelativeStrength!==true || r.researchBeforeExecution!==true || r.antiChaseEntryTiming!==true || r.tradeVolumeObjective!==false || !["1Min","5Min","15Min","1Hour","4Hour","1Day"].every(t=>tf.includes(t))) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.strategy!=="free-tier-deep-crypto-v9" || x.cryptoEntryBuild!=="free-tier-research-v4" || x.endpoint!=="paper" || x.exitPolicy!=="profit_reversal_protection" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`route=${x.market} reason=${x.reason} stock=${x.stockBest?.symbol}:${x.stockBest?.score} crypto=${x.cryptoBest?.symbol}:${x.cryptoBest?.score}`); if(x.build!=="free-tier-research-v4" || !["stock","crypto"].includes(x.market) || !x.reason || typeof x.stockBest?.score!=="number" || typeof x.cryptoBest?.score!=="number") process.exit(6)' "$ROUTER"
