name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 55
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 25 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/state")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} status=${x.status} endpoint=${x.endpoint} universe=${x.safeguards?.maxUniverseSymbols} positions=${x.safeguards?.maxConcurrentPositions} min_score=${x.safeguards?.minEntryScore}`); if(x.strategy!=="intraday-adaptive-v8.3" || x.endpoint!=="paper" || x.status!=="armed" || x.features?.dynamicScanner!==true || x.safeguards?.minEntryScore!==1 || x.safeguards?.maxConcurrentPositions!==6 || x.safeguards?.maxUniverseSymbols!==100 || Math.abs((x.safeguards?.maxSpreadPct||0)-0.01)>1e-9 || x.safeguards?.minDollarVolume!==1000000 || x.safeguards?.minPriceUsd!==1 || x.safeguards?.symbolCooldownMinutes!==1) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); const c=x.runtimeConfig||{}; const d=x.diagnostics||{}; console.log(`mode=${x.mode} equity=${x.equity} buying_power=${x.buyingPower} order_notional=${c.orderNotionalUsd} total_exposure=${c.maxTotalExposureUsd} universe=${d.universeCount} valid=${d.validSignals} ranked=${d.rankedCount}`); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError || c.orderNotionalUsd!==25000 || c.maxPositionUsd!==25000 || c.maxTotalExposureUsd!==150000 || c.maxConcurrentPositions!==6 || c.maxUniverseSymbols!==100 || c.minEntryScore!==1 || Math.abs((c.riskPerTradePct||0)-0.004)>1e-9 || Math.abs((c.targetRMultiple||0)-2.4)>1e-9 || c.symbolCooldownMinutes!==1 || c.orderTimeoutSeconds!==45 || !(d.universeCount>0)) process.exit(3)' "$STATE"
