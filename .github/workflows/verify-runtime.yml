name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for expected production strategy and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          for i in $(seq 1 40); do
            CRYPTO="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/crypto/status" || true)"
            OPP="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/opportunity" || true)"
            if node -e 'try{const x=JSON.parse(process.argv[1]);const o=JSON.parse(process.argv[2]);process.exit(x.strategy==="free-tier-crypto-v21"&&o.strategy==="free-tier-crypto-v21"&&o.readOnly===true&&Array.isArray(o.candidates)?0:1)}catch{process.exit(1)}' "$CRYPTO" "$OPP"; then
              exit 0
            fi
            sleep 2
          done
          echo 'Expected v21 strategy and diagnostics did not reach production in verification window'
          exit 1
      - name: Check crypto-priority production runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/live")"
          OPPORTUNITY="$(curl --fail --silent --show-error --max-time 90 "$BASE/api/crypto/opportunity")"
          ROUTER="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/router/opportunity")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          echo "PRODUCTION_CRYPTO_OPPORTUNITY=$OPPORTUNITY"
          echo "PRODUCTION_ROUTER=$ROUTER"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.strategy!=="free-tier-deep-stock-v13" || x.endpoint!=="paper" || x.status!=="armed" || x.primaryExecutionMarket!=="crypto" || x.newStockEntriesEnabled!==false || x.stockMode!=="manage_only") process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.positionSummary) || !Array.isArray(x.recentOrders)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.freeTier||{},r=x.research||{},tf=r.timeframes||[]; if(x.strategy!=="free-tier-crypto-v21" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || x.entryOrderType!=="protected_limit_ioc" || x.hardStopExitOrderType!=="market" || x.profitExitOrderType!=="protected_limit_ioc" || x.positionPnlSource!=="executable_bid_only" || x.liquiditySizingPolicy!=="quote_depth_first_venue_volume_fallback" || x.primaryExecutionMarket!=="crypto" || x.newStockEntriesEnabled!==false || f.architecture!=="all_tradable_usd_crypto_multitimeframe_velocity_rank" || f.finalists!==6 || r.stablecoinsExcluded!==true || r.multiTimeframeConfirmation!==true || r.persistenceConfirmation!==true || r.volumeExpansionResearch!==true || r.staleOrderCancellation!==true || r.hardStopExecutableOnly!==true || r.singleMinuteExitDisabled!==true || r.minHoldBeforeNoiseExit!==true || r.rotationRequiresNetProfit!==true || r.dailyDrawdownCircuitBreaker!==true || r.qualityOverTurnover!==true || r.liquidityAwarePositionSizing!==true || r.equityScaledPositionSizing!==true || r.maxPortfolioExposurePct!==0.50 || r.tradeVolumeObjective!==false || x.minHoldMinutes!==5 || x.reentryCooldownMinutes!==20 || x.hardStopReentryCooldownMinutes!==60 || x.dailyDrawdownLimitPct!==0.02 || !(x.maxBookParticipation>0&&x.maxBookParticipation<=0.35) || !["1Min","5Min","15Min","1Day"].every(t=>tf.includes(t))) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`v21Orders=${x.currentStrategyOrderCount} v21Positions=${x.cryptoPositionCount} last=${x.lastCurrentStrategyOrderAt}`); if(x.strategy!=="free-tier-crypto-v21" || x.endpoint!=="paper" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const e=x.candidates.filter(c=>c.eligible); console.log(`qualified=${x.qualifiedCount} eligible=${e.map(c=>c.symbol+":"+c.finalOrderNotional).join(",")} held=${x.heldSymbols?.join(",")} cooldown=${x.cooldownSymbols?.join(",")} dd=${x.dailyDrawdownPct} blocked=${x.dailyDrawdownBlocked}`); if(x.strategy!=="free-tier-crypto-v21" || x.readOnly!==true || !Array.isArray(x.candidates) || typeof x.qualifiedCount!=="number" || typeof x.dailyDrawdownBlocked!=="boolean") process.exit(7)' "$OPPORTUNITY"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`route=${x.market} reason=${x.reason} crypto=${x.cryptoBest?.symbol}:${x.cryptoBest?.score}`); if(x.market!=="crypto" || x.newStockEntriesEnabled!==false || typeof x.cryptoBest?.score!=="number") process.exit(6)' "$ROUTER"
