name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for expected hybrid production runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          for i in $(seq 1 90); do
            STATUS="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/status" || true)"
            CRYPTO="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/status" || true)"
            STOCK_OPP="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/stock/opportunity" || true)"
            if node -e 'try{const s=JSON.parse(process.argv[1]);const c=JSON.parse(process.argv[2]);const o=JSON.parse(process.argv[3]);process.exit(s.strategy==="free-tier-deep-stock-v14"&&s.build==="free-tier-research-v6-quant"&&s.primaryExecutionMarket==="hybrid"&&s.newStockEntriesEnabled===true&&c.strategy==="quant-crypto-v24"&&c.alphaMinScore===85&&c.dailyDrawdownLimitPct===0.03&&c.maxHoldingMinutes===60&&c.leverage===1&&c.futuresEnabled===false&&o.strategy==="free-tier-deep-stock-v14"&&o.readOnly===true&&Array.isArray(o.candidates)?0:1)}catch{process.exit(1)}' "$STATUS" "$CRYPTO" "$STOCK_OPP"; then
              exit 0
            fi
            sleep 2
          done
          echo 'Expected v24 quant hybrid runtime did not reach production'
          exit 1
      - name: Check v24 quant recovery runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/state")"
          STOCK_OPP="$(curl --fail --silent --show-error --max-time 90 "$BASE/api/stock/opportunity")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/crypto/live")"
          OPPORTUNITY="$(curl --fail --silent --show-error --max-time 150 "$BASE/api/crypto/opportunity")"
          DIRECTIVE="$(curl --fail --silent --show-error --max-time 150 "$BASE/api/crypto/directive")"
          ROUTER="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/router/opportunity")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_STOCK_OPPORTUNITY=$STOCK_OPP"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          echo "PRODUCTION_CRYPTO_OPPORTUNITY=$OPPORTUNITY"
          echo "PRODUCTION_CRYPTO_DIRECTIVE=$DIRECTIVE"
          echo "PRODUCTION_ROUTER=$ROUTER"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; if(x.strategy!=="free-tier-deep-stock-v14" || x.endpoint!=="paper" || x.status!=="armed" || x.build!=="free-tier-research-v6-quant" || x.primaryExecutionMarket!=="hybrid" || x.newStockEntriesEnabled!==true || x.stockMode!=="liquid_intraday_recovery" || x.cryptoMode!=="quant_alpha85_recovery" || x.entryEnabled!==true || x.maxPositions!==1 || x.maxPositionUsd!==12000 || r.candidateDiagnostics!==true) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.mode!=="direct_alpaca_rest" || x.build!=="free-tier-research-v6-quant" || !(x.equity>0) || !Array.isArray(x.positionSummary) || !Array.isArray(x.recentOrders)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.strategy!=="free-tier-deep-stock-v14" || x.readOnly!==true || !Array.isArray(x.candidates) || typeof x.marketOpen!=="boolean") process.exit(8)' "$STOCK_OPP"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{},tf=r.timeframes||[]; if(x.strategy!=="quant-crypto-v24" || x.enabled!==true || x.endpoint!=="paper" || x.entryOrderType!=="protected_limit_ioc_depth_slice" || x.positionPnlSource!=="executable_bid_only" || x.crossVenueProvider!=="coinbase_exchange" || x.alphaMinScore!==85 || x.dailyDrawdownLimitPct!==0.03 || x.breakerFreezeHours!==4 || x.maxHoldingMinutes!==60 || x.leverage!==1 || x.futuresEnabled!==false || x.shortsEnabled!==false || r.trailing72hWinRateProfitFactor!==true || r.fractionalKellyQuarter!==true || r.correlationGuard24h!==true || r.twapLikeDepthCappedSlicing!==true || !["1Min","5Min","15Min","60Min","72h-regime-test"].every(t=>tf.includes(t))) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.strategy!=="quant-crypto-v24" || x.endpoint!=="paper" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const h=x.marketDataHealth||{}; console.log(`crypto scan=${x.scannedUniverseCount} deep=${x.deepResearchedCount} qualified=${x.qualifiedCount} dd=${x.drawdown?.rolling24hPct} coinbaseAvailable=${h.availableCount}`); if(x.strategy!=="quant-crypto-v24" || x.readOnly!==true || x.venue!=="alpaca_spot" || x.leverageSupported!==false || x.shortsSupported!==false || !Array.isArray(x.candidates) || !x.drawdown || !x.recovery || h.provider!=="coinbase_exchange" || !(h.availableCount>=1) || h.allUnavailable===true) process.exit(6)' "$OPPORTUNITY"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`directive=${x.direction} asset=${x.selected_asset} score=${x.alpha_confidence_score}`); if(!x.timestamp_utc || !["LONG","NEUTRAL"].includes(x.direction) || typeof x.scanned_universe_count!=="number" || !x.execution_parameters || x.execution_parameters.leverage!==1 || x.execution_parameters.max_holding_duration_minutes!==60 || !x.portfolio_risk_metrics || !x.execution_constraints || x.execution_constraints.futures_enabled!==false || (x.direction==="NEUTRAL" && !(x.market_data_health?.available_count>=1))) process.exit(9)' "$DIRECTIVE"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.newStockEntriesEnabled!==true || typeof x.cryptoBest?.score!=="number" || !["hybrid","crypto"].includes(x.market)) process.exit(7)' "$ROUTER"
