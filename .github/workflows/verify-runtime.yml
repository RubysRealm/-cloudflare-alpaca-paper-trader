name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 45
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/state")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} status=${x.status} endpoint=${x.endpoint} feed=${x.features?.marketDataFeed} universe=${x.safeguards?.maxUniverseSymbols} positions=${x.safeguards?.maxConcurrentPositions} stream=${x.features?.realtimeWebSocketRelay} persistent=${x.features?.persistentState}`); if(x.strategy!=="intraday-adaptive-v8.1.1" || x.endpoint!=="paper" || x.status!=="armed" || x.features?.dynamicScanner!==true || x.features?.marketDataFeed!=="iex" || x.features?.realtimeWebSocketRelay!==false || x.features?.persistentState!==false || x.safeguards?.minEntryScore!==86 || x.safeguards?.maxConcurrentPositions!==4 || x.safeguards?.maxUniverseSymbols!==40 || Math.abs((x.safeguards?.maxDailyLossPct||0)-0.015)>1e-9 || Math.abs((x.safeguards?.maxSpreadPct||0)-0.0012)>1e-9 || x.safeguards?.minDollarVolume!==75000000 || x.safeguards?.symbolCooldownMinutes!==30) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`mode=${x.mode} equity=${x.equity} buying_power=${x.buyingPower} positions=${x.positions} bot_orders_today=${x.botOrdersToday} last_bot_order=${x.lastBotOrderAt||"none"}`); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError) process.exit(3)' "$STATE"
