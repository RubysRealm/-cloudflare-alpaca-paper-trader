name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 55
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 25 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/status")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); const s=x.safeguards||{}; console.log(`strategy=${x.strategy} status=${x.status} endpoint=${x.endpoint} universe=${s.maxUniverseSymbols} positions=${s.maxConcurrentPositions} exposure=${s.maxTotalExposureUsd} min_score=${s.minEntryScore}`); if(x.strategy!=="intraday-profitability-v8.4" || x.endpoint!=="paper" || x.status!=="armed" || x.features?.dynamicScanner!==true || x.features?.profitabilityFirst!==true || x.features?.conflictAwareExposure!==true || s.minEntryScore!==82 || s.maxConcurrentPositions!==4 || s.maxUniverseSymbols!==100 || s.maxNewEntriesPerCycle!==1 || s.maxTotalExposureUsd!==100000 || Math.abs((s.maxDailyLossPct||0)-0.0125)>1e-9 || Math.abs((s.maxSpreadPct||0)-0.003)>1e-9 || s.minDollarVolume!==10000000 || s.symbolCooldownMinutes!==10) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); const c=x.runtimeConfig||{}; const d=x.diagnostics||{}; console.log(`mode=${x.mode} equity=${x.equity} buying_power=${x.buyingPower} order_notional=${c.orderNotionalUsd} total_exposure=${c.maxTotalExposureUsd} universe=${d.universeCount} valid=${d.validSignals} ranked=${d.rankedCount}`); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError || c.orderNotionalUsd!==25000 || c.maxPositionUsd!==25000 || c.maxTotalExposureUsd!==100000 || c.maxConcurrentPositions!==4 || c.maxUniverseSymbols!==100 || c.minEntryScore!==82 || Math.abs((c.riskPerTradePct||0)-0.0035)>1e-9 || Math.abs((c.targetRMultiple||0)-2.4)>1e-9 || c.symbolCooldownMinutes!==10 || c.orderTimeoutSeconds!==45 || !(d.universeCount>0)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`crypto_strategy=${x.strategy} enabled=${x.enabled} market=${x.market} universe=${x.universeCount} data=${x.marketDataReachable} positions=${x.maxConcurrentPositions} exposure=${x.maxTotalExposureUsd}`); if(x.strategy!=="crypto-profitability-v1" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || !(x.universeCount>0) || x.marketDataReachable!==true || x.maxConcurrentPositions!==4 || x.maxTotalExposureUsd!==100000 || x.minEntryScore!==82 || Math.abs((x.targetRMultiple||0)-2.4)>1e-9 || x.symbolCooldownMinutes!==10) process.exit(4)' "$CRYPTO"
