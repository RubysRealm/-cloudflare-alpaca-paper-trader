name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 90
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 45 "$BASE/api/crypto/live")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const s=x.safeguards||{},f=x.features||{},tf=f.multiTimeframe||[]; console.log(`stock=${x.strategy} universe=${s.maxUniverseSymbols} positions=${s.maxConcurrentPositions} order=${s.orderNotionalUsd} edge=${s.minExpectedNetEdgePct}`); if(x.strategy!=="selective-conviction-v9" || x.endpoint!=="paper" || x.status!=="armed" || f.dynamicScanner!==true || f.selectiveConviction!==true || f.tradeVolumeObjective!==false || f.expectedNetEdgeRanking!==true || f.opportunityCostExit!==true || f.profitabilityFirst!==true || !["1Min","5Min","15Min","1Hour"].every(t=>tf.includes(t)) || s.minEntryScore!==94 || Math.abs((s.minExpectedNetEdgePct||0)-0.006)>1e-9 || s.maxConcurrentPositions!==2 || s.maxUniverseSymbols!==150 || s.maxNewEntriesPerCycle!==1 || s.maxTotalExposureUsd!==70000 || s.orderNotionalUsd!==35000 || Math.abs((s.maxDailyLossPct||0)-0.0125)>1e-9 || Math.abs((s.maxSpreadPct||0)-0.003)>1e-9 || s.minDollarVolume!==10000000 || s.symbolCooldownMinutes!==10) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); const c=x.runtimeConfig||{}; const d=x.diagnostics||{}; console.log(`state_equity=${x.equity} order=${c.orderNotionalUsd} maxpos=${c.maxConcurrentPositions} universe=${c.maxUniverseSymbols}`); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError || c.orderNotionalUsd!==35000 || c.maxPositionUsd!==35000 || c.maxTotalExposureUsd!==70000 || c.maxConcurrentPositions!==2 || c.maxUniverseSymbols!==150 || c.minEntryScore!==94 || Math.abs((c.riskPerTradePct||0)-0.005)>1e-9 || c.symbolCooldownMinutes!==10 || c.orderTimeoutSeconds!==45 || !(d.universeCount>0)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; const tf=r.timeframes||[]; console.log(`crypto=${x.strategy} build=${x.cryptoEntryBuild} universe=${x.universeCount} positions=${x.maxConcurrentPositions} order=${x.orderNotionalUsd} edge=${x.minExpectedNetEdgePct}`); if(x.strategy!=="crypto-conviction-v6" || x.cryptoEntryBuild!=="crypto-conviction-v6" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || !["USD","USDC","USDT","BTC"].every(q=>(x.quoteMarkets||[]).includes(q)) || x.marketDataReachable!==true || x.orderBookReachable!==true || r.cycleMinutes!==1 || r.universeRefreshMinutes!==1 || r.orderBookDepth!==true || r.crossMarketConfirmation!==true || r.broadMarketAnchorConfirmation!==true || r.scansAllQuoteMarkets!==true || r.selectiveConviction!==true || r.tradeVolumeObjective!==false || r.expectedNetEdgeRanking!==true || r.opportunityCostExit!==true || r.singleEngineOwnership!==true || r.priceProtectedIocEntries!==true || r.profitProtectedIocExits!==true || r.fixedProfitTarget!==false || r.trailingProfitProtection!==true || r.profitToLossGuard!==true || r.reentryBelowLastSell!==false || r.normalLossTakingExits!==false || r.costAwareEntries!==true || !["1Min","5Min","15Min","1Hour","4Hour"].every(t=>tf.includes(t)) || x.maxConcurrentPositions!==2 || x.maxTotalExposureUsd!==50000 || x.orderNotionalUsd!==25000 || x.minEntryScore!==94 || Math.abs((x.minExpectedNetEdgePct||0)-0.01)>1e-9 || Math.abs((x.minRewardToCost||0)-2)>1e-9 || x.fixedProfitTargetPct!==0) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`live_crypto=${x.strategy} build=${x.cryptoEntryBuild} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-conviction-v6" || x.cryptoEntryBuild!=="crypto-conviction-v6" || x.endpoint!=="paper" || x.exitPolicy!=="selective_conviction_profit_rotation" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
