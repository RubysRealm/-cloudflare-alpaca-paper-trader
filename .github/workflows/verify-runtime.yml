name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 55
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 25 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/state")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`strategy=${x.strategy} status=${x.status} endpoint=${x.endpoint} feed=${x.features?.marketDataFeed} universe=${x.safeguards?.maxUniverseSymbols} positions=${x.safeguards?.maxConcurrentPositions}`); if(x.strategy!=="intraday-adaptive-v8.2" || x.endpoint!=="paper" || x.status!=="armed" || x.features?.dynamicScanner!==true || x.features?.marketDataFeed!=="iex" || x.features?.realtimeWebSocketRelay!==false || x.features?.persistentState!==false || x.safeguards?.minEntryScore!==84 || x.safeguards?.maxConcurrentPositions!==6 || x.safeguards?.maxUniverseSymbols!==60 || Math.abs((x.safeguards?.maxDailyLossPct||0)-0.015)>1e-9 || Math.abs((x.safeguards?.maxSpreadPct||0)-0.0012)>1e-9 || x.safeguards?.minDollarVolume!==75000000 || x.safeguards?.symbolCooldownMinutes!==15) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); const c=x.runtimeConfig||{}; console.log(`mode=${x.mode} equity=${x.equity} buying_power=${x.buyingPower} order_notional=${c.orderNotionalUsd} max_position=${c.maxPositionUsd} total_exposure=${c.maxTotalExposureUsd} target_r=${c.targetRMultiple} risk=${c.riskPerTradePct} timeout=${c.orderTimeoutSeconds}`); if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError || c.orderNotionalUsd!==25000 || c.maxPositionUsd!==25000 || c.maxTotalExposureUsd!==150000 || c.maxConcurrentPositions!==6 || c.maxUniverseSymbols!==60 || c.minEntryScore!==84 || Math.abs((c.riskPerTradePct||0)-0.004)>1e-9 || Math.abs((c.targetRMultiple||0)-2.4)>1e-9 || c.symbolCooldownMinutes!==15 || c.orderTimeoutSeconds!==45) process.exit(3)' "$STATE"
