name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for expected production strategy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          for i in $(seq 1 30); do
            CRYPTO="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/crypto/status" || true)"
            if node -e 'try{const x=JSON.parse(process.argv[1]);process.exit(x.strategy==="free-tier-crypto-v19"?0:1)}catch{process.exit(1)}' "$CRYPTO"; then
              exit 0
            fi
            sleep 2
          done
          echo 'Expected v19 strategy did not reach production in verification window'
          exit 1
      - name: Check crypto-priority production runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 60 "$BASE/api/crypto/live")"
          ROUTER="$(curl --fail --silent --show-error --max-time 75 "$BASE/api/router/opportunity")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          echo "PRODUCTION_ROUTER=$ROUTER"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.strategy!=="free-tier-deep-stock-v13" || x.build!=="free-tier-research-v4" || x.endpoint!=="paper" || x.status!=="armed" || x.primaryExecutionMarket!=="crypto" || x.newStockEntriesEnabled!==false || x.stockMode!=="manage_only" || x.adaptiveMarketRouting!==false) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.mode!=="direct_alpaca_rest" || x.build!=="free-tier-research-v4" || !(x.equity>0) || !Array.isArray(x.positionSummary) || !Array.isArray(x.recentOrders)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); const f=x.freeTier||{},r=x.research||{},tf=r.timeframes||[]; if(x.strategy!=="free-tier-crypto-v19" || x.cryptoEntryBuild!=="free-tier-research-v4" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || x.entryOrderType!=="market" || x.hardStopExitOrderType!=="market" || x.profitExitOrderType!=="protected_limit_ioc" || x.positionPnlSource!=="executable_bid_for_profit_and_risk_floor" || x.primaryExecutionMarket!=="crypto" || x.newStockEntriesEnabled!==false || x.adaptiveMarketRouting!==false || f.architecture!=="all_tradable_usd_crypto_gross_velocity_rank" || f.finalists!==6 || r.allActiveTradablePairs!==true || r.fullExecutableUsdUniverse!==true || r.percentageVelocityPriority!==true || r.grossRevenuePriority!==true || r.megaCapDeprioritization!==true || r.liquidMajorsEligible!==true || r.quoteDepthLiquidity!==true || r.venueVolumeFallbackLiquidity!==true || r.candidateDiagnostics!==true || r.stagnantPositionRotation!==true || r.profitTargetLiquidation!==true || r.dynamicCostAwareProfitTarget!==true || r.fillReliableLiquidation!==true || r.reentryCooldown!==true || r.executableProfitCheck!==true || r.profitFloorProtection!==true || r.liquidityAwarePositionSizing!==true || r.equityScaledPositionSizing!==true || r.maxPortfolioExposurePct!==0.85 || r.researchBeforeExecution!==true || r.tradeVolumeObjective!==true || x.reentryCooldownMinutes!==5 || x.hardStopReentryCooldownMinutes!==20 || !(x.maxBookParticipation>0&&x.maxBookParticipation<=0.75) || !(x.maxDailyVolumeParticipation>0&&x.maxDailyVolumeParticipation<=0.05) || !(x.takeProfitPct>0) || !["1Min","1Day"].every(t=>tf.includes(t))) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`v19Orders=${x.currentStrategyOrderCount} v19Positions=${x.cryptoPositionCount} last=${x.lastCurrentStrategyOrderAt}`); if(x.strategy!=="free-tier-crypto-v19" || x.cryptoEntryBuild!=="free-tier-research-v4" || x.endpoint!=="paper" || x.exitPolicy!=="gross_velocity_profit_rotation" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`route=${x.market} reason=${x.reason} crypto=${x.cryptoBest?.symbol}:${x.cryptoBest?.score}`); if(x.build!=="free-tier-research-v4" || x.market!=="crypto" || x.reason!=="crypto_priority_new_entries_stock_manage_only" || x.newStockEntriesEnabled!==false || typeof x.cryptoBest?.score!=="number") process.exit(6)' "$ROUTER"
