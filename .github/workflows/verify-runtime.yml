name: Verify production Worker runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/v8/**'
      - 'wrangler.toml'
      - '.github/workflows/verify-runtime.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 90
      - name: Check exact production runtime and direct Alpaca state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cody-alpaca-paper-guard.codygiles28.workers.dev'
          BODY="$(curl --fail --silent --show-error --max-time 25 "$BASE/api/status")"
          STATE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/state")"
          CRYPTO="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/status")"
          CRYPTO_LIVE="$(curl --fail --silent --show-error --max-time 35 "$BASE/api/crypto/live")"
          echo "PRODUCTION_STATUS=$BODY"
          echo "PRODUCTION_STATE=$STATE"
          echo "PRODUCTION_CRYPTO=$CRYPTO"
          echo "PRODUCTION_CRYPTO_LIVE=$CRYPTO_LIVE"
          node -e 'const x=JSON.parse(process.argv[1]); const s=x.safeguards||{}; if(x.strategy!=="intraday-profitability-v8.4" || x.endpoint!=="paper" || x.status!=="armed" || x.features?.dynamicScanner!==true || x.features?.profitabilityFirst!==true || x.features?.conflictAwareExposure!==true || s.minEntryScore!==82 || s.maxConcurrentPositions!==4 || s.maxUniverseSymbols!==100 || s.maxNewEntriesPerCycle!==1 || s.maxTotalExposureUsd!==100000 || Math.abs((s.maxDailyLossPct||0)-0.0125)>1e-9 || Math.abs((s.maxSpreadPct||0)-0.003)>1e-9 || s.minDollarVolume!==10000000 || s.symbolCooldownMinutes!==10) process.exit(2)' "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); const c=x.runtimeConfig||{}; const d=x.diagnostics||{}; if(x.mode!=="direct_alpaca_rest" || !(x.equity>0) || !Array.isArray(x.recentBotOrders) || x.stateError || c.orderNotionalUsd!==25000 || c.maxPositionUsd!==25000 || c.maxTotalExposureUsd!==100000 || c.maxConcurrentPositions!==4 || c.maxUniverseSymbols!==100 || c.minEntryScore!==82 || Math.abs((c.riskPerTradePct||0)-0.0035)>1e-9 || Math.abs((c.targetRMultiple||0)-2.4)>1e-9 || c.symbolCooldownMinutes!==10 || c.orderTimeoutSeconds!==45 || !(d.universeCount>0)) process.exit(3)' "$STATE"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x.research||{}; const tf=r.timeframes||[]; console.log(`crypto_strategy=${x.strategy} build=${x.cryptoEntryBuild} universe=${x.universeCount} quotes=${JSON.stringify(x.quoteMarkets)} fixed_target=${r.fixedProfitTarget} trailing=${r.trailingProfitProtection} reentry_lower=${r.reentryBelowLastSell}`); if(x.strategy!=="crypto-revenue-v5" || x.cryptoEntryBuild!=="crypto-revenue-v5" || x.enabled!==true || x.endpoint!=="paper" || x.market!=="24x7" || !(x.universeCount>=73) || x.allActiveTradablePairs!==true || !["USD","USDC","USDT","BTC"].every(q=>(x.quoteMarkets||[]).includes(q)) || x.marketDataReachable!==true || x.orderBookReachable!==true || r.cycleMinutes!==1 || r.universeRefreshMinutes!==1 || r.orderBookDepth!==true || r.crossMarketConfirmation!==true || r.scansAllQuoteMarkets!==true || r.singleEngineOwnership!==true || r.priceProtectedIocEntries!==true || r.profitProtectedIocExits!==true || r.fixedProfitTarget!==false || r.trailingProfitProtection!==true || r.profitToLossGuard!==true || r.reentryBelowLastSell!==true || r.normalLossTakingExits!==false || r.costAwareEntries!==true || !["1Min","5Min","15Min","1Hour","4Hour"].every(t=>tf.includes(t)) || x.maxConcurrentPositions!==4 || x.maxTotalExposureUsd!==4000 || x.minEntryScore!==82 || x.fixedProfitTargetPct!==0) process.exit(4)' "$CRYPTO"
          node -e 'const x=JSON.parse(process.argv[1]); console.log(`live_strategy=${x.strategy} build=${x.cryptoEntryBuild} positions=${x.cryptoPositionCount} current_orders=${x.currentStrategyOrderCount} legacy_history=${x.legacyHistoricalOrderCount}`); if(x.strategy!=="crypto-revenue-v5" || x.cryptoEntryBuild!=="crypto-revenue-v5" || x.endpoint!=="paper" || x.exitPolicy!=="trail_profit_then_reenter_lower" || x.legacyExecutionActive!==false || !Array.isArray(x.cryptoPositions) || !Array.isArray(x.recentCurrentStrategyOrders)) process.exit(5)' "$CRYPTO_LIVE"
